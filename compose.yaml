services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildos_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: buildos
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buildos_admin -d buildos']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  migrate:
    profiles: ['app']
    build: { context: '.', target: api }
    command: ['pnpm', '--filter', '@buildos/api', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://buildos:${DB_PASSWORD}@postgres:5432/buildos
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: ['app']
    build: { context: '.', target: api }
    environment:
      NODE_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://buildos:${DB_PASSWORD}@postgres:5432/buildos
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: 'false'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:8080}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    profiles: ['app']
    build: { context: '.', target: web }
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
