name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-admin
          POSTGRES_DB: buildos
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d buildos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_DATABASE_ADMIN_URL: postgresql://postgres:synthetic-ci-admin@127.0.0.1:5432/buildos
      TEST_DATABASE_URL: postgresql://buildos_ci:synthetic-ci-password@127.0.0.1:5432/buildos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-db.mjs
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
